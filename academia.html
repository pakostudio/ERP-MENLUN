<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academia Menlun</title>
<link rel="icon" href="data:,">
<style>
  :root{--bg:#f5f7fa;--card:#fff;--text:#1e2a3a;--text2:#64748b;--brand:#0f4c81;--brand2:#13689e;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--border:#e2e8f0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .top{background:var(--brand);color:#fff;padding:18px 16px;display:flex;align-items:center;gap:10px}
  .top .logo{width:30px;height:30px;border-radius:7px;background:#fff2;display:flex;align-items:center;justify-content:center;font-weight:800}
  .top h1{font-size:16px;margin:0}
  .top p{margin:2px 0 0;font-size:12px;opacity:.85}
  .wrap{max-width:560px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
  .card.locked{opacity:.6}
  .curso-title{font-weight:700;font-size:15px;margin:0 0 2px}
  .meta{color:var(--text2);font-size:12px;margin-bottom:10px}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .b-pendiente{background:#fef3c7;color:var(--warn)}
  .b-en_curso{background:#dbeafe;color:var(--brand2)}
  .b-completado{background:#dcfce7;color:var(--ok)}
  .b-vencido{background:#fee2e2;color:var(--bad)}
  .btn{display:inline-block;background:var(--brand);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;margin-right:8px;margin-top:8px}
  .btn.secondary{background:#fff;color:var(--brand);border:1px solid var(--brand)}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .eval{border-top:1px dashed var(--border);margin-top:12px;padding-top:12px}
  .pregunta{margin-bottom:12px}
  .pregunta strong{display:block;font-size:13px;margin-bottom:6px}
  .opcion{display:block;font-size:13px;color:#455867;margin:4px 0;cursor:pointer}
  .opcion input{margin-right:6px}
  .msg{font-size:12px;margin-top:6px}
  .ok{color:var(--ok)} .err{color:var(--bad)}
  .state{text-align:center;color:var(--text2);padding:40px 16px}
  .folio{font-family:monospace;font-size:12px;background:#f1f5f9;padding:6px 8px;border-radius:6px;display:inline-block;margin-top:6px}
  .intentos{font-size:11px;color:var(--text2);margin-top:4px}
  .lockmsg{font-size:12px;color:var(--warn);margin-top:6px}
</style>
</head>
<body>
  <div class="top">
    <div class="logo">A</div>
    <div>
      <h1>Academia Menlun</h1>
      <p id="subtitulo">Cursos de la empresa</p>
    </div>
  </div>
  <div class="wrap" id="wrap">
    <div class="state" id="estado">Cargando tus cursos…</div>
  </div>

<script>
const SUPABASE_URL = "https://diqbmyqvuyollvlvjniz.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpcWJteXF2dXlvbGx2bHZqbml6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwODA5MjEsImV4cCI6MjA5OTY1NjkyMX0.VAL6-eUHRZyZhmf3clD8ht3sa9pCoyBMIzZSCg16cBs";

function qs(name){ return new URLSearchParams(location.search).get(name); }
const TOKEN = qs('t');
const wrap = document.getElementById('wrap');
const estadoEl = document.getElementById('estado');
const subtitulo = document.getElementById('subtitulo');

async function rpc(fn, args){
  const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': ANON_KEY,
      'Authorization': 'Bearer ' + ANON_KEY
    },
    body: JSON.stringify(args)
  });
  return r.json();
}

const ETIQUETA = { pendiente: 'Pendiente', en_curso: 'En curso', completado: 'Completado', vencido: 'Vencido' };

function preguntaHtml(asignacionId, p){
  const opciones = p.opciones.map(o => `
    <label class="opcion">
      <input type="radio" name="resp-${asignacionId}-q${p.numero}" value="${o.valor}">
      ${o.texto}
    </label>`).join('');
  return `<div class="pregunta"><strong>${p.numero}. ${p.pregunta}</strong>${opciones}</div>`;
}

function cursoCard(c){
  const badge = `<span class="badge b-${c.estado}">${ETIQUETA[c.estado] || c.estado}</span>`;
  const yaAprobado = c.evaluacion && c.evaluacion.aprobado;
  const linkCurso = c.url_curso ? `<a class="btn" href="${c.url_curso}" target="_blank" rel="noopener">Abrir curso</a>` : '';

  if (c.bloqueado) {
    return `
      <div class="card locked">
        <p class="curso-title">Etapa ${c.etapa} &middot; ${c.titulo}</p>
        <div class="meta">Nivel: ${c.nivel || '-'} ${badge}</div>
        <div class="lockmsg">Disponible al aprobar la etapa anterior de este tema.</div>
      </div>`;
  }

  let evalHtml = '';
  if (yaAprobado) {
    evalHtml = `<div class="eval"><div class="msg ok">Aprobado con ${c.evaluacion.calificacion}/100 &#10003;</div><div class="intentos">Intentos: ${c.evaluacion.intentos}</div></div>`;
  } else {
    const intentosPrevios = (c.evaluacion && c.evaluacion.intentos) || 0;
    const preguntasHtml = (c.preguntas || []).map(p => preguntaHtml(c.asignacion_id, p)).join('');
    const intentoMsg = intentosPrevios > 0
      ? `<div class="msg err">No alcanzaste el mínimo (70) en tu intento anterior (${c.evaluacion.calificacion}/100). Vuelve a intentarlo.</div>`
      : '';
    evalHtml = `
      <div class="eval">
        <div class="meta">Evaluación del curso (mínimo 70 para aprobar):</div>
        ${intentoMsg}
        <form id="form-${c.asignacion_id}">
          ${preguntasHtml}
          <button type="button" class="btn secondary" onclick="enviarEvaluacion('${c.asignacion_id}')">Enviar evaluación</button>
        </form>
        <div class="msg" id="msg-${c.asignacion_id}"></div>
        <div class="intentos">Intentos: ${intentosPrevios}</div>
      </div>`;
  }

  return `
    <div class="card">
      <p class="curso-title">Etapa ${c.etapa} &middot; ${c.titulo}</p>
      <div class="meta">Nivel: ${c.nivel || '-'} ${badge}</div>
      <div class="row">${linkCurso}
        <button class="btn secondary" onclick="marcarVisto('${c.asignacion_id}')" ${c.estado==='completado'?'disabled':''}>Marcar como visto</button>
      </div>
      ${evalHtml}
    </div>`;
}

async function cargar(){
  if (!TOKEN) {
    estadoEl.textContent = 'Liga inválida. Pide a RH que te reenvíe tu acceso a Academia Menlun.';
    return;
  }
  const res = await rpc('academia_cargar', { p_token: TOKEN });
  if (!res || res.ok === false) {
    estadoEl.textContent = (res && res.error) || 'No se pudo cargar tu información.';
    return;
  }
  subtitulo.textContent = 'Hola, ' + res.empleado.nombre;
  if (!res.cursos || res.cursos.length === 0) {
    estadoEl.textContent = 'Todavía no tienes cursos asignados. Pregunta a RH.';
    return;
  }
  estadoEl.remove();
  wrap.innerHTML = res.cursos.map(cursoCard).join('');
}

window.marcarVisto = async function(asignacionId){
  await rpc('academia_marcar_modulo', { p_token: TOKEN, p_asignacion_id: asignacionId, p_modulo_num: 1, p_modulo_titulo: 'Curso visto' });
  cargar();
};

window.enviarEvaluacion = async function(asignacionId){
  const form = document.getElementById('form-' + asignacionId);
  const msg = document.getElementById('msg-' + asignacionId);
  const inputs = form.querySelectorAll('input[type=radio]:checked');
  const respuestas = {};
  inputs.forEach(inp => {
    const m = inp.name.match(/-q(\d+)$/);
    if (m) respuestas['q' + m[1]] = inp.value;
  });
  const totalPreguntas = new Set([...form.querySelectorAll('input[type=radio]')].map(i => i.name)).size;
  if (Object.keys(respuestas).length < totalPreguntas) {
    msg.textContent = 'Responde todas las preguntas antes de enviar.';
    msg.className = 'msg err';
    return;
  }
  msg.textContent = 'Calificando...'; msg.className = 'msg';
  const res = await rpc('academia_enviar_evaluacion', { p_token: TOKEN, p_asignacion_id: asignacionId, p_respuestas: respuestas });
  if (res && res.ok) {
    msg.textContent = res.aprobado
      ? `¡Aprobado! ${res.aciertos}/${res.total} correctas (${res.calificacion}/100).`
      : `No aprobado: ${res.aciertos}/${res.total} correctas (${res.calificacion}/100). Mínimo 70. Intenta de nuevo.`;
    msg.className = res.aprobado ? 'msg ok' : 'msg err';
    setTimeout(cargar, 1200);
  } else {
    msg.textContent = (res && res.error) || 'No se pudo calificar.';
    msg.className = 'msg err';
  }
};

cargar();
</script>
</body>
</html>
